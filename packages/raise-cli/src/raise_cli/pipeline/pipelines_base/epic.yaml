name: epic
description: "Default epic — PDCV design sub-pipeline + story fan-out (ADR-134 v2)"
issue_types:
  - epic

phases:
  - id: start
    type: llm
    skill: rai-epic-start
    # transition: epic initialized, scope committed — work is active in current cycle
    target_status: committed

  - id: design
    type: llm
    pipeline: epic-design-pdcv
    # transition: PDCV design sub-pipeline complete; tracker signals active design phase
    target_status: design

  - id: plan
    type: llm
    skill: rai-epic-plan
    target_status: implement
    validates:
      - pattern: "work/epics/**/scope.md"
        description: "Epic scope document (plan appended)"
    gate:
      type: hitl
      level: REVIEW
      impact: low

  - id: stories
    type: llm
    pipeline: story
    foreach: stories
    # transition: story fan-out executing; epic tracker reflects active implementation
    target_status: implement

  - id: close
    type: llm
    skill: rai-epic-close
    # S10 (RAISE-15037): blocking — failed transition halts the pipeline run.
    target_status: done
    transition_mode: blocking
    validates:
      - pattern: "work/epics/**/scope.md"
