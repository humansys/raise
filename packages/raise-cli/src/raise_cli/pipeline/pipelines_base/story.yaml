name: story
description: "Canonical story default — 5 fases via Agent() dispatch, contexto fresco por fase (ADR-143 C1 canonical default)"
issue_types:
  - story
  - task

execution:
  worktree_isolation: false  # Agent() provee aislamiento de contexto

# Canonical edition (ADR-143 C1): start → design → implement → verify → close (5 fases)
# Enterprise eliminadas: plan, architecture-review, pir, review (5+)
# Skills: lean residues de rai-story-{start,close} + rai-story-design (portfolio-aware, S1.15341) + enterprise rai-{story-implement,quality-review} (Opción A)
# Referencia: work/epics/e14770-lean-methodology/skill-audit.md + ADR-134 v2 + RAISE-15345
phases:
  - id: start
    type: llm
    skill: rai-story-start
    # Canónico post-ADR-143 B1: rai-story-start-lean colapsado en rai-story-start

  - id: design
    type: llm
    skill: rai-story-design
    when: "size != 'XS'"
    # Portfolio-grounded design (RAISE-15341): rai portfolio suggest al inicio del gemba walk
    # Sin gate HITL — lean. rai-story-design ya corre fail-open si no hay portfolio context.
    validates:
      - pattern: "work/epics/**/stories/*-design.md"
        description: "Design artifact produced before implement runs"

  - id: implement
    type: llm
    skill: rai-story-implement
    # Opción A (30% ceremonia — texto pasivo): el orquestador inyecta prompt directivo
    # "ejecuta TDD sin HITL per-task; calidad garantizada por gates y raise_task_complete"
    validates:
      - patterns:
          - "tests/**/*.py"
          - "packages/*/tests/**/*.py"
        description: "Al menos un test file presente (TDD requirement)"

  - id: verify
    type: llm
    skill: rai-quality-review
    # Opción A (32% ceremonia — texto pasivo): el orquestador inyecta prompt directivo
    # "emite solo verdict + findings críticos, omite output format verbose"

  - id: close
    type: llm
    skill: rai-story-close
    # Canónico post-ADR-143 B2: rai-story-close-lean colapsado en rai-story-close
    # S10 (RAISE-15037): blocking — failed transition halts the pipeline run.
    target_status: done
    transition_mode: blocking
    validates:
      - pattern: "work/epics/**/stories/s*.md"
        description: "Story scope artifact (producido por start)"
